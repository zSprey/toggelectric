<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Preconnect & DNS-Prefetch Performance Optimization -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://cdn.tailwindcss.com">
    <title>Masaüstü QR Kodlu İstasyon & Servis Standı (A5/A6 PDF)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0c1222; color: #1e293b; }
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; padding: 0 !important; }
            .print-card { box-shadow: none !important; border: 2px solid #000 !important; width: 148mm !important; height: 210mm !important; }
        }
    </style>
</head>
<body class="p-4 sm:p-8 flex flex-col items-center min-h-screen">

    <div class="max-w-md w-full mb-6 no-print flex justify-between items-center">
        <a href="/" aria-label="Ana Sayfaya Dön" class="text-xs text-slate-400 hover:text-white"><i class="fa-solid fa-arrow-left mr-1"></i> Siteye Dön</a>
        <button onclick="window.print()" aria-label="A5 Standı PDF Olarak Yazdır" class="bg-gradient-to-r from-cyan-400 to-emerald-400 text-slate-950 font-black px-5 py-2.5 rounded-xl text-xs shadow-lg flex items-center gap-2">
            <i class="fa-solid fa-print"></i> A5 Standı PDF Olarak Yazdır
        </button>
    </div>

    <!-- STAND TEMPLATE (A5/A6 Card) -->
    <div class="print-card bg-white rounded-3xl p-8 max-w-sm w-full shadow-2xl border-4 border-slate-900 text-center flex flex-col justify-between space-y-6">
        
        <!-- Header -->
        <div>
            <div class="w-14 h-14 rounded-2xl bg-slate-950 text-cyan-400 flex items-center justify-center mx-auto text-2xl font-black mb-3">
                <i class="fa-solid fa-bolt-lightning"></i>
            </div>
            <h1 class="text-2xl font-black text-slate-950 tracking-tight">Togg Connected Mobility</h1>
            <p class="text-xs font-bold text-slate-500 uppercase tracking-widest mt-1">Akıllı Şarj & Batarya Servis Noktası</p>
        </div>

        <!-- Dynamic QR Code Card -->
        <div class="bg-slate-50 p-6 rounded-2xl border-2 border-dashed border-slate-300 flex flex-col items-center justify-center space-y-3">
            <img loading="lazy" src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=https://toggelectric.com" alt="QR Code" class="w-44 h-44 rounded-xl shadow-sm">
            <span class="text-xs font-black text-slate-800 uppercase tracking-wider">
                <i class="fa-solid fa-camera text-cyan-600 mr-1"></i> Kameranızı Okutun
            </span>
        </div>

        <!-- Action Items -->
        <div class="text-left space-y-2 text-xs font-semibold text-slate-700">
            <div class="flex items-center gap-2"><i class="fa-solid fa-circle-check text-emerald-600 text-sm"></i> 300kW HPC Anlık Doluluk ve Fiyatı Görün</div>
            <div class="flex items-center gap-2"><i class="fa-solid fa-circle-check text-cyan-600 text-sm"></i> Batarya SoH Ekspertiz Sertifikası Alın</div>
            <div class="flex items-center gap-2"><i class="fa-solid fa-circle-check text-blue-600 text-sm"></i> T-Care Mobil Servis Randevusu Oluşturun</div>
        </div>

        <!-- Footer -->
        <div class="border-t border-slate-200 pt-3 text-[10px] text-slate-400 font-mono">
            chargetogg.com • servicetogg.com • toggelectric.com
        </div>

    </div>

</body>
</html>
