<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Preconnect & DNS-Prefetch Performance Optimization -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://cdn.tailwindcss.com">
    <title>ChargeTogg Canlı Şarj & SoH Widget</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        body { background: transparent; font-family: system-ui, -apple-system, sans-serif; }
        .glass-widget { background: rgba(8, 13, 24, 0.95); backdrop-filter: blur(16px); border: 1px solid rgba(0, 229, 255, 0.3); }
    </style>
</head>
<body class="p-3 flex items-center justify-center min-h-screen">
    <div class="glass-widget rounded-2xl p-5 max-w-sm w-full shadow-2xl text-slate-100 space-y-4">
        <div class="flex justify-between items-center border-b border-white/10 pb-3">
            <div class="flex items-center gap-2">
                <span class="w-8 h-8 rounded-xl bg-cyan-500 flex items-center justify-center text-slate-950 font-black text-sm">
                    <i class="fa-solid fa-bolt"></i>
                </span>
                <div>
                    <h3 class="text-sm font-black text-white">Trugo 300kW HPC</h3>
                    <p class="text-[10px] text-slate-400">Oksijen O-5 Dinlenme Tesisi</p>
                </div>
            </div>
            <span class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-[10px] font-bold px-2 py-0.5 rounded-full">
                🟢 2/2 Boş
            </span>
        </div>

        <div class="grid grid-cols-2 gap-2 text-center text-xs">
            <div class="bg-white/5 p-2.5 rounded-xl">
                <span class="text-[9px] text-slate-400 uppercase font-bold">Maks. Güç</span>
                <div class="text-base font-black text-cyan-300 mt-0.5">300 kW</div>
            </div>
            <div class="bg-white/5 p-2.5 rounded-xl">
                <span class="text-[9px] text-slate-400 uppercase font-bold">Tarife (DC)</span>
                <div class="text-base font-black text-white mt-0.5">14.98 ₺</div>
            </div>
        </div>

        <div class="space-y-2">
            <a href="https://chargetogg.com/#harita" target="_blank" class="w-full bg-gradient-to-r from-cyan-400 to-emerald-400 text-slate-950 font-black py-2.5 rounded-xl text-xs flex items-center justify-center gap-2 transition hover:opacity-90">
                <i class="fa-solid fa-location-arrow"></i> Canlı Rota Başlat
            </a>
            <p class="text-[9px] text-center text-slate-500">
                Bu widget <a href="https://chargetogg.com" target="_blank" class="text-cyan-400 underline">ChargeTogg</a> tarafından desteklenmektedir.
            </p>
        </div>
    </div>
</body>
</html>
