<!DOCTYPE html>
<html lang="tr" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToggElectric | Haber & Topluluk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: '#3b82f6', bgmain: '#09090b', bgsec: '#18181b', lightmain: '#f1f5f9', lightsec: '#ffffff' } } } }</script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-lightmain dark:bg-bgmain text-gray-800 dark:text-gray-200 transition-colors">
    <nav class="bg-white/80 dark:bg-bgmain/80 backdrop-blur-xl border-b border-gray-200 dark:border-gray-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 flex justify-between h-16 items-center">
            <span class="text-black dark:text-white text-2xl font-black"><i class="fa-solid fa-car-side text-brand mr-2"></i>Togg<span class="text-brand">Electric</span></span>
            <div class="hidden md:flex space-x-6">
                <button onclick="toggleWriterPanel()" class="text-brand font-bold"><i class="fa-solid fa-pen-nib mr-1"></i> Yazar Girisi</button>
            </div>
            <button onclick="toggleTheme()" class="text-gray-500 hover:text-brand"><i id="themeIcon" class="fa-solid fa-sun text-xl"></i></button>
        </div>
    </nav>

    <!-- Yazar Paneli (CMS) -->
    <div id="writerPanel" class="hidden fixed inset-0 bg-black/80 z-[100] flex items-center justify-center">
        <div class="bg-white dark:bg-bgsec p-8 rounded-2xl w-full max-w-2xl mx-4 border border-gray-200 dark:border-gray-800 shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-black dark:text-white">CMS: Haber Ekle</h2>
                <button onclick="toggleWriterPanel()" class="text-gray-500"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <form onsubmit="event.preventDefault(); alert('Makale veritabanina kaydedildi (Auto-Seed)'); toggleWriterPanel();" class="space-y-4">
                <input type="text" placeholder="Haber Basligi" class="w-full bg-gray-100 dark:bg-bgmain border border-gray-300 dark:border-gray-700 p-3 rounded dark:text-white" required>
                <textarea placeholder="Haber Icerigi (Markdown destekler)" rows="5" class="w-full bg-gray-100 dark:bg-bgmain border border-gray-300 dark:border-gray-700 p-3 rounded dark:text-white" required></textarea>
                <button type="submit" class="w-full bg-brand text-white font-bold py-3 rounded">Yayinla</button>
            </form>
        </div>
    </div>

    <section class="max-w-7xl mx-auto px-4 py-12">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="newsGrid">
            <div class="bg-white dark:bg-bgsec p-6 rounded-3xl border border-gray-200 dark:border-gray-800">
                <span class="text-brand text-xs font-bold uppercase mb-2 block">Guncelleme</span>
                <h2 class="text-2xl font-black dark:text-white mb-2">TruOS v1.5.3 Yayinda</h2>
                <p class="text-gray-500 text-sm">Adaptif hiz sabitleyici ve batarya optimizasyonu iceren yeni surum araclara gonderilmeye baslandi.</p>
            </div>
            <div class="bg-white dark:bg-bgsec p-6 rounded-3xl border border-gray-200 dark:border-gray-800">
                <span class="text-brand text-xs font-bold uppercase mb-2 block">Yatirim</span>
                <h2 class="text-2xl font-black dark:text-white mb-2">Trugo'dan 50 Yeni HPC</h2>
                <p class="text-gray-500 text-sm">Ankara-Izmir otoyolunda 300 kW gucunde yeni istasyonlar aciliyor.</p>
            </div>
        </div>
    </section>

    <script>
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            document.getElementById('themeIcon').className = document.documentElement.classList.contains('dark') ? 'fa-solid fa-sun text-xl' : 'fa-solid fa-moon text-xl';
        }
        function toggleWriterPanel() { document.getElementById('writerPanel').classList.toggle('hidden'); }
    </script>
</body>
</html>
