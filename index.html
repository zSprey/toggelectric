<head>

    <!-- OpenGraph & Twitter Cards -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://toggelectric.com/">
    <meta property="og:title" content="ToggElectric | Türkiye Elektrikli Araç Topluluğu & SoH Ekspertiz">
    <meta property="og:description" content="Türkiye elektrikli araç topluluğu, batarya SoH ekspertiz sertifikası ve günlük EV haberleri">
    <meta property="og:image" content="/assets/images/togg_charging_hero.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="ToggElectric | Türkiye Elektrikli Araç Topluluğu & SoH Ekspertiz">
    <meta name="twitter:description" content="Türkiye elektrikli araç topluluğu, batarya SoH ekspertiz sertifikası ve günlük EV haberleri">
    <meta name="twitter:image" content="/assets/images/togg_charging_hero.jpg">

    <!-- Schema.org Organization JSON-LD -->
    <script>
    let valState = {
        model: 'LR',
        year: 2026,
        km: 25000,
        soh: 96
    };

    let currentAnimatedValuation = 1850000;
    let valAnimFrameId = null;

    function selectValuationModel(modelType) {
        valState.model = modelType;
        const btnLR = document.getElementById('btnModelLR');
        const btnStd = document.getElementById('btnModelStd');
        if (btnLR && btnStd) {
            if (modelType === 'LR') {
                btnLR.className = 'model-select-btn active p-4 rounded-2xl border-2 border-cyan-400 bg-cyan-500/10 text-left transition flex flex-col justify-between';
                btnStd.className = 'model-select-btn p-4 rounded-2xl border border-white/10 bg-white/5 hover:border-white/20 text-left transition flex flex-col justify-between';
            } else {
                btnStd.className = 'model-select-btn active p-4 rounded-2xl border-2 border-cyan-400 bg-cyan-500/10 text-left transition flex flex-col justify-between';
                btnLR.className = 'model-select-btn p-4 rounded-2xl border border-white/10 bg-white/5 hover:border-white/20 text-left transition flex flex-col justify-between';
            }
        }
        calculateToggValuation();
    }

    function selectValuationYear(year) {
        valState.year = parseInt(year, 10);
        const buttons = document.querySelectorAll('.year-btn');
        buttons.forEach(btn => {
            if (parseInt(btn.getAttribute('data-year'), 10) === valState.year) {
                btn.className = 'year-btn active py-3 rounded-xl border-2 border-cyan-400 bg-cyan-500/15 text-sm font-bold text-cyan-300 transition';
            } else {
                btn.className = 'year-btn py-3 rounded-xl border border-white/10 bg-white/5 hover:border-cyan-400 text-sm font-bold text-slate-300 transition';
            }
        });
        calculateToggValuation();
    }

    function updateValuationKm(val) {
        valState.km = parseInt(val, 10);
        const kmDisp = document.getElementById('valKmDisplay');
        if (kmDisp) kmDisp.innerText = valState.km.toLocaleString('tr-TR') + ' km';
        calculateToggValuation();
    }

    function updateValuationSoh(val) {
        valState.soh = parseInt(val, 10);
        const sohDisp = document.getElementById('valSohDisplay');
        if (sohDisp) sohDisp.innerText = '%' + valState.soh + ' SoH';
        calculateToggValuation();
    }

    function calculateToggValuation() {
        const basePrice = valState.model === 'LR' ? 1850000 : 1550000;
        
        const yearDiff = 2026 - valState.year;
        const yearDepreciation = yearDiff * 0.12;
        const yearFactor = Math.max(0.4, 1 - yearDepreciation);

        const kmDepreciation = (valState.km / 50000) * 0.03;
        const kmFactor = Math.max(0.6, 1 - kmDepreciation);

        const sohDiff = valState.soh - 90;
        const sohFactor = 1 + (sohDiff * 0.02);

        const rawValuation = basePrice * yearFactor * kmFactor * sohFactor;
        const finalPrice = Math.round(rawValuation / 1000) * 1000;

        const baseDisp = document.getElementById('valBaseDisplay');
        const yrImp = document.getElementById('valYearImpact');
        const kmImp = document.getElementById('valKmImpact');
        const sohImp = document.getElementById('valSohImpact');
        const descEl = document.getElementById('valSummaryDesc');

        if (baseDisp) baseDisp.innerText = '₺' + basePrice.toLocaleString('tr-TR');
        if (yrImp) yrImp.innerText = yearDiff === 0 ? '%0 (2026 Güncel)' : '-%' + Math.round(yearDepreciation * 100) + ' (' + yearDiff + ' Yıl)';
        if (kmImp) kmImp.innerText = '-%' + (kmDepreciation * 100).toFixed(1) + ' (' + valState.km.toLocaleString('tr-TR') + ' km)';
        if (sohImp) {
            const sign = sohDiff >= 0 ? '+' : '';
            sohImp.innerText = sign + '%' + (sohDiff * 2) + ' (SoH ' + valState.soh + '%)';
            sohImp.className = sohDiff >= 0 ? 'font-mono font-bold text-emerald-400' : 'font-mono font-bold text-rose-400';
        }

        if (descEl) {
            const modelName = valState.model === 'LR' ? 'T10X Uzun Menzil (V2)' : 'T10X Standart Menzil (V1)';
            descEl.innerText = valState.year + ' Model ' + modelName + ' • ' + valState.km.toLocaleString('tr-TR') + ' km • %' + valState.soh + ' SoH Batarya';
        }

        animateValuationPrice(finalPrice);
    }

    function animateValuationPrice(targetPrice) {
        const el = document.getElementById('valPriceOutput');
        if (!el) return;

        if (valAnimFrameId) cancelAnimationFrame(valAnimFrameId);

        const startPrice = currentAnimatedValuation;
        const startTime = performance.now();
        const duration = 350;

        function step(now) {
            const progress = Math.min((now - startTime) / duration, 1);
            const easeOutQuad = 1 - (1 - progress) * (1 - progress);
            const current = Math.round(startPrice + (targetPrice - startPrice) * easeOutQuad);
            el.innerText = '₺' + current.toLocaleString('tr-TR');

            if (progress < 1) {
                valAnimFrameId = requestAnimationFrame(step);
            } else {
                currentAnimatedValuation = targetPrice;
                el.innerText = '₺' + targetPrice.toLocaleString('tr-TR');
            }
        }
        valAnimFrameId = requestAnimationFrame(step);
    }

    function requestValuationCertificate() {
        const modelName = valState.model === 'LR' ? 'Togg T10X Uzun Menzil (88.5 kWh)' : 'Togg T10X Standart Menzil (52.4 kWh)';
        const priceFormatted = '₺' + currentAnimatedValuation.toLocaleString('tr-TR');
        const certNo = 'TR-VAL-' + Math.floor(100000 + Math.random() * 900000);
        
        alert('Ekspertiz ve Değerleme Raporu Hazırlandı!\n\nSertifika No: ' + certNo + '\nAraç: ' + modelName + '\nKilometre: ' + valState.km.toLocaleString('tr-TR') + ' km\nBatarya SoH: %' + valState.soh + '\nTahmini Piyasa Değeri: ' + priceFormatted);
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', calculateToggValuation);
    } else {
        calculateToggValuation();
    }
</script>
<!-- WAVE 2: Intersection Observer Fade-In Animations & Performance -->
<style>
html{scroll-behavior:smooth}
.fade-section{opacity:0;transform:translateY(30px);transition:opacity 0.8s ease,transform 0.8s ease}
.fade-section.visible{opacity:1;transform:translateY(0)}
</style>
<script>
document.addEventListener('DOMContentLoaded',function(){
var sections=document.querySelectorAll('section');
sections.forEach(function(s){s.classList.add('fade-section')});
var observer=new IntersectionObserver(function(entries){
entries.forEach(function(e){if(e.isIntersecting){e.target.classList.add('visible');observer.unobserve(e.target)}})
},{threshold:0.1});
sections.forEach(function(s){observer.observe(s)});
});
</script>
<!-- WAVE 3: Back to Top Floating Button & Cookie Consent Banner -->
<button id="backToTopBtn" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" aria-label="Sayfa Başına Dön" class="fixed bottom-6 right-6 z-50 w-12 h-12 rounded-full bg-emerald-500/80 hover:bg-emerald-500 text-white shadow-lg shadow-emerald-500/30 flex items-center justify-center transition-all duration-300 opacity-0 pointer-events-none hover:scale-110">
    <i class="fa-solid fa-arrow-up text-lg"></i>
</button>

<div id="cookieConsentBanner" class="fixed bottom-4 left-4 right-4 sm:left-auto sm:right-4 max-w-md z-50 p-4 rounded-2xl bg-slate-950/95 backdrop-blur-xl border border-white/10 shadow-2xl transition-all duration-500 transform translate-y-24 opacity-0 pointer-events-none flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 text-xs">
    <div class="text-slate-300 flex items-center gap-2">
        <i class="fa-solid fa-cookie-bite text-amber-400 text-base shrink-0"></i>
        <span>Bu site deneyiminizi iyileştirmek için çerezler kullanmaktadır.</span>
    </div>
    <div class="flex items-center gap-2 shrink-0 w-full sm:w-auto">
        <button onclick="acceptCookieConsent()" aria-label="Çerezleri Kabul Et" class="flex-1 sm:flex-none px-4 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold transition shadow-md">
            Kabul Et
        </button>
    </div>
</div>

<script>
window.addEventListener('scroll', function() {
    var btn = document.getElementById('backToTopBtn');
    if (btn) {
        if (window.scrollY > 300) {
            btn.classList.remove('opacity-0', 'pointer-events-none');
            btn.classList.add('opacity-100');
        } else {
            btn.classList.add('opacity-0', 'pointer-events-none');
            btn.classList.remove('opacity-100');
        }
    }
});

function initCookieConsent() {
    if (!localStorage.getItem('cookie_consent_accepted')) {
        setTimeout(function() {
            var banner = document.getElementById('cookieConsentBanner');
            if (banner) {
                banner.classList.remove('translate-y-24', 'opacity-0', 'pointer-events-none');
                banner.classList.add('translate-y-0', 'opacity-100');
            }
        }, 800);
    }
}
function acceptCookieConsent() {
    localStorage.setItem('cookie_consent_accepted', 'true');
    var banner = document.getElementById('cookieConsentBanner');
    if (banner) {
        banner.classList.add('translate-y-24', 'opacity-0', 'pointer-events-none');
        banner.classList.remove('translate-y-0', 'opacity-100');
    }
}
document.addEventListener('DOMContentLoaded', initCookieConsent);
</script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js')}</script>
